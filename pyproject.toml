[project]
name = "llm"
version = "0.1.0"
description = "An attempt at a large language model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "typer>=0.27.2",
]
[project.scripts]
llm = "llm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]
